services:
  - type: web
    name: energy-project-readiness
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: "gemini"
